<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso de Português</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #111111;
      margin: 0 auto;
      padding: 20px 16px;
      max-width: 640px;
      font-size: 20px;
      line-height: 1.5;
    }
    header {
      border-bottom: 1px solid #dddddd;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .course-label {
      font-size: 16px;
      color: #555555;
      margin: 0;
    }
    h1 {
      color: #8B1E24;
      font-size: 28px;
      font-weight: normal;
      margin: 0 0 8px 0;
    }
    .subtitle {
      font-size: 19px;
      color: #444444;
      margin: 0 0 22px 0;
    }
    .btn-inbox {
      display: block;
      width: 100%;
      background-color: #111111;
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      padding: 16px;
      margin-bottom: 24px;
      border-radius: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 520px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .square-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
      border: 3px solid #8B1E24;
      background-color: #ffffff;
      padding: 20px;
      text-decoration: none;
      color: #111111;
      border-radius: 6px;
    }
    .square-card:active, .square-card:hover {
      background-color: #fdf5f5;
    }
    .mod-num {
      font-size: 17px;
      font-weight: bold;
      color: #8B1E24;
      text-transform: uppercase;
    }
    .mod-title {
      font-size: 24px;
      font-weight: bold;
      color: #111111;
      line-height: 1.3;
      margin: 12px 0;
    }
    .mod-go {
      font-size: 19px;
      color: #8B1E24;
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <p class="course-label">Ensino de Português Brasileiro como Língua de Acolhimento</p>
  </header>

  <h1>Curso de Português</h1>
  <p class="subtitle">Toque no módulo abaixo para começar:</p>

  <a class="btn-inbox" href="respostas.html">📩 Ver respostas da professora</a>

  <div class="grid">
    <!-- CUADRADO DEL MÓDULO 1 -->
    <a class="square-card" href="modulo1.html">
      <span class="mod-num">Módulo 1</span>
      <span class="mod-title">1 O conceito de língua de acolhimento</span>
      <span class="mod-go">Entrar no módulo &rarr;</span>
    </a>
  </div>

</body>
</html>
